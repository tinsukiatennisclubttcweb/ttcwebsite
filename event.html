<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Detail — Tinsukia Tennis Club</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/events.css">
</head>
<body>

  <!-- Dynamic NAV injected by shared.js (requires the DOM to render first, so hardcoding fallback) -->
  <nav class="nav nav--solid" id="navbar">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">Tinsukia Tennis Club</a>
      <div class="nav__links">
        <a href="index.html" class="nav__link">Home</a>
        <a href="club.html" class="nav__link">The Club</a>
        <a href="coaching.html" class="nav__link">Coaching</a>
        <a href="members.html" class="nav__link">Members</a>
        <a href="talents.html" class="nav__link">Talents</a>
        <a href="events.html" class="nav__link is-active">Events</a>
        <a href="facilities.html" class="nav__link">Facilities</a>
        <a href="gallery.html" class="nav__link">Gallery</a>
        <a href="contact.html" class="nav__link">Contact</a>
      </div>
      <div class="nav__cta-wrap"><a href="membership.html" class="btn btn--primary btn--sm">Join the Club <span class="btn__arrow">→</span></a></div>
      <button class="nav__hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" class="mobile-menu__link">Home</a>
    <a href="club.html" class="mobile-menu__link">The Club</a>
    <a href="coaching.html" class="mobile-menu__link">Coaching</a>
    <a href="members.html" class="mobile-menu__link">Members</a>
    <a href="talents.html" class="mobile-menu__link">Talents</a>
    <a href="events.html" class="mobile-menu__link is-active">Events</a>
    <a href="facilities.html" class="mobile-menu__link">Facilities</a>
    <a href="gallery.html" class="mobile-menu__link">Gallery</a>
    <a href="contact.html" class="mobile-menu__link">Contact</a>
    <div class="mobile-menu__cta"><a href="membership.html" class="btn btn--primary">Join the Club</a></div>
  </div>

  <section class="section section--dark" style="min-height: 100vh; padding-top: 160px;">
    <div class="container container--narrow">
      <div class="mb-lg" data-reveal="fade">
        <a href="events.html" class="back-link text-muted-light">
          <span class="back-link__arrow">←</span> All Events
        </a>
      </div>

      <div id="eventDetailContent">
        <!-- Rendered by event-detail.js -->
        <div style="height: 300px; display: flex; align-items: center; justify-content: center;">
          <p class="text-muted">Loading event details...</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer" id="footer-placeholder"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/event-detail.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('footer-placeholder').outerHTML = TTC.getFooterHTML();
    });
  </script>

</html>
