<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Tinsukia Tennis Club</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body class="section--dark"> <!-- Dark page -->

  <nav class="nav nav--solid" id="navbar">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">Tinsukia Tennis Club</a>
      <div class="nav__links">
        <a href="index.html" class="nav__link">Home</a>
        <a href="club.html" class="nav__link">The Club</a>
        <a href="coaching.html" class="nav__link">Coaching</a>
        <a href="members.html" class="nav__link">Members</a>
        <a href="talents.html" class="nav__link">Talents</a>
        <a href="events.html" class="nav__link">Events</a>
        <a href="facilities.html" class="nav__link">Facilities</a>
        <a href="gallery.html" class="nav__link is-active">Gallery</a>
        <a href="contact.html" class="nav__link">Contact</a>
      </div>
      <div class="nav__cta-wrap"><a href="membership.html" class="btn btn--primary btn--sm">Join the Club</a></div>
      <button class="nav__hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu"></div>

  <section class="section" style="padding-top: calc(var(--nav-height) + 60px);">
    <div class="container text-center mb-xl">
      <span class="section-number mx-auto" data-reveal>Moments</span>
      <h1 class="h1 text-white mt-sm" data-clip-reveal>The Archives.</h1>
    </div>

    <!-- The grid will expand to fill the width minus padding -->
    <div style="padding: 0 var(--container-padding);">
      <div class="gallery-grid" id="galleryGrid">
        <p class="text-muted-light text-center col-span-full py-8">Loading images...</p>
      </div>
    </div>
  </section>

  <!-- Shared.js automatically initializes lightbox HTML in the body, but let's make sure there's a container if we want it hardcoded, or we rely on JS. Actually, we should hardcode it to ensure it's there before JS binds. -->
  <div id="lightbox-placeholder"></div>

  <footer class="footer" id="footer-placeholder"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/gallery.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('footer-placeholder').outerHTML = TTC.getFooterHTML();
      document.getElementById('lightbox-placeholder').outerHTML = TTC.getLightboxHTML();
      const mobileMenuHtml = TTC.getNavHTML().split('class="mobile-menu"')[1];
      if (mobileMenuHtml) document.getElementById('mobileMenu').outerHTML = '<div class="mobile-menu"' + mobileMenuHtml;
    });
  </script>
</body>
</html>
