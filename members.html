<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members — Tinsukia Tennis Club</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,900&family=Public+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/members.css">
</head>

<body>

  <!-- Nav -->
  <nav class="nav nav--solid" id="navbar">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">Tinsukia Tennis Club</a>
      <div class="nav__links">
        <a href="index.html" class="nav__link">Home</a>
        <a href="club.html" class="nav__link">The Club</a>
        <a href="coaching.html" class="nav__link">Coaching</a>
        <a href="members.html" class="nav__link is-active">Members</a>
        <a href="talents.html" class="nav__link">Talents</a>
        <a href="events.html" class="nav__link">Events</a>
        <a href="facilities.html" class="nav__link">Facilities</a>
        <a href="gallery.html" class="nav__link">Gallery</a>
        <a href="contact.html" class="nav__link">Contact</a>
      </div>
      <div class="nav__cta-wrap"><a href="membership.html" class="btn btn--primary btn--sm">Join the Club <span
            class="btn__arrow">→</span></a></div>
      <button class="nav__hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <!-- Links -->
  </div>

  <header class="page-hero page-hero--tall">
    <div class="page-hero__bg" data-parallax data-speed="0.2">
      <img src="images/members/membershero.png" alt="Club members on court" loading="eager">
    </div>
    <div class="page-hero__overlay page-hero__overlay--heavy"></div>
    <div class="page-hero__content">
      <div class="page-hero__label" data-reveal><span class="label text-accent">Community</span></div>
      <h1 class="page-hero__heading" data-clip-reveal>The People<br>of TTC.</h1>
      <p class="page-hero__desc" data-reveal data-delay="100">The players, coaches and enthusiasts who make our club a
        thriving tennis community.</p>
    </div>
  </header>

  <section class="section section--cream">
    <div class="container">

      <div class="member-filters mt-lg" data-reveal>
        <button class="member-filter is-active" data-filter="all">All Members</button>
        <button class="member-filter" data-filter="committee">Committee</button>
        <button class="member-filter" data-filter="player">Players</button>
        <button class="member-filter" data-filter="coach">Coaches</button>
      </div>

      <div class="members-grid" id="membersGrid">
        <!-- Rendered dynamically by members.js -->
        <p class="text-center col-span-full text-muted py-8">Loading community...</p>
      </div>

    </div>
  </section>

  <footer class="footer" id="footer-placeholder"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/members.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('footer-placeholder').outerHTML = TTC.getFooterHTML();
      // Also inject mobile menu to save space
      const mobileMenuHtml = TTC.getNavHTML().split('class="mobile-menu"')[1];
      if (mobileMenuHtml) document.getElementById('mobileMenu').outerHTML = '<div class="mobile-menu"' + mobileMenuHtml;
    });
  </script>
</body>

</html>
